name: CI

on:
  # main and the active release/vX.Y.Z branch (see git-workflow skill): a PR
  # merge lands as a merge commit that PR-triggered CI never re-checks by
  # itself, so push needs to cover both, not just main.
  push:
    branches: [main, "release/v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Build the embedded UI (installs web deps), run the frontend unit tests,
      # then vet/test/build the Go binary.
      - run: make ui
      # `make ui` has just rebuilt web/dist from web/src, so anything left in the
      # diff is a committed bundle that no longer matches its source. Nothing else
      # here notices: every other step uses the copy CI just built. Binaries cut
      # from a tag rebuild it too (`make release` depends on `ui`), but `go install`
      # embeds whatever is committed — that channel ships the stale bundle alone.
      - name: committed web/dist matches web/src
        run: |
          if ! git diff --quiet -- web/dist; then
            git diff --stat -- web/dist
            echo "::error::web/dist is stale. Rebuild with 'make ui' and commit the result."
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-debug
          path: web/dist
          retention-days: 1
      - run: npm run test --prefix web
      - run: gofmt -l $(git ls-files '*.go') | tee /tmp/fmt && test ! -s /tmp/fmt
      - run: go vet ./...
      # -short skips the Docker/Redis/LDAP/SMTP integration tests: they need
      # live backends, are subject to Docker Hub rate limits on shared CI IPs,
      # and have hit a go1.25 + modernc-sqlite connection-pool stall on hosted
      # runners. They run locally via a plain `go test ./...`. The timeout is a
      # backstop so the job never hangs for the full budget.
      - run: go test -short -timeout=120s -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1   # unit coverage (informational)
      - run: go build ./...
